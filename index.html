<!-- ============ DOM STRUCTURE (style.css / layout.js depend on these IDs) ============ -->
<div id="wallpaper">
    <div id="bg-container"></div>
    <div id="bg-overlay"></div>
    <div id="photo-wall"></div>

    <!-- Author watermark -->
    <div id="author-watermark">清野兰奈</div>

    <!-- Lyrics display (2-line scroll) -->
    <div id="lyrics-display">
        <div id="lyrics-scroll"></div>
    </div>
    <div id="lyrics-toast">暂无歌词</div>

    <!-- Music controller panel -->
    <div id="music-controller">
        <!-- Top bar: prev | play | next | title | vol | playlist -->
        <div id="mc-bar">
            <button class="mc-btn" id="mc-prev" title="上一首">&#9664;&#9664;</button>
            <button class="mc-btn mc-play" id="mc-play" title="播放/暂停"><span class="ico-play"></span><span class="ico-pause"></span></button>
            <button class="mc-btn" id="mc-next" title="下一首">&#9654;&#9654;</button>
            <button class="mc-btn" id="mc-shuffle" title="顺序播放"><svg class="ico-seq" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="8" x2="17" y2="8"></line><polyline points="13 4 17 8 13 12"></polyline><line x1="3" y1="16" x2="17" y2="16"></line><polyline points="13 12 17 16 13 20"></polyline></svg><svg class="ico-shuf" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line><line x1="9" y1="15" x2="15" y2="9"></line></svg></button>
            <span id="mc-title">未加载</span>
            <button class="mc-btn" id="mc-vol-toggle" title="音量">&#9834;</button>
            <button class="mc-btn" id="mc-playlist-toggle" title="播放列表">&#9776;</button>
        </div>

        <!-- Progress bar -->
        <div id="mc-progress">
            <span class="mc-time" id="mc-current">0:00</span>
            <div id="mc-seek-bar">
                <div id="mc-progress-fill"></div>
                <div id="mc-progress-handle"></div>
            </div>
            <span class="mc-time" id="mc-total">0:00</span>
        </div>

        <!-- Volume slider panel -->
        <div id="mc-volume-panel">
            <div id="mc-vol-slider">
                <div id="mc-vol-fill"></div>
                <div id="mc-vol-handle"></div>
            </div>
        </div>

        <!-- Playlist -->
        <div id="mc-playlist-wrap">
            <ul id="mc-playlist"></ul>
            <div id="mc-pl-scrollbar"><div id="mc-pl-thumb"></div></div>
        </div>

        <!-- Add local music -->
        <div id="mc-add-local">
            <button id="mc-add-btn">+ 添加本地音乐</button>
            <input type="file" id="mc-file-input" accept="audio/*,.lrc" multiple hidden>
        </div>
    </div>

    <!-- Vignette overlay -->
    <div class="vignette"></div>
</div>

<!-- ============ AUDIO ELEMENT (hidden, no src, no autoplay, no loop) ============ -->
<audio id="bgm" preload="auto"></audio>

<!-- ============ EXTERNAL SCRIPTS (load first so they can find their DOM elements) ============ -->
<script src="layout.js"></script>

    // Pre-parse built-in LRC at page load (synchronous, no fetch)
    (function () {

    function buildPlaylist() {
        playlist = [];
        trackNames = [];
        for (var i = 0; i < BUILTIN_TRACKS.length; i++) {
            // BUILTIN_TRACKS file values are bare (e.g. "bgm.mp3"); real files live in bgm/
            playlist.push('bgm/' + BUILTIN_TRACKS[i].file);
            trackNames.push(BUILTIN_TRACKS[i].name + ' - ' + BUILTIN_TRACKS[i].artist);
        }

    buildPlaylist();

    // ---- LRC parser ----
    function parseLrc(raw) {
        if (!raw) return [];
        var lines = raw.split(/\r?\n/);
        var result = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            var m = line.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
            if (m) {
                var min = parseInt(m[1], 10);
                var sec = parseFloat(m[2]);
                var time = min * 60 + sec;
                var text = m[3].trim();
                if (text) result.push({ time: time, text: text });
            }
        }
        result.sort(function (a, b) { return a.time - b.time; });
        return result;
    }

    // ---- HTML escape helper ----
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---- Find lyrics for track index (from pre-parsed map) ----
    function findLyricsForTrack(index) {
        if (index < 0 || index >= trackNames.length) return null;
        var trackName = (trackNames[index] || '').trim();
        var keys = Object.keys(lyricsMap);

        if (lyricsMap[trackName]) return lyricsMap[trackName];
        for (var k = 0; k < keys.length; k++) {
            if (keys[k].toLowerCase() === trackName.toLowerCase()) return lyricsMap[keys[k]];
        }

        var url = playlist[index] || '';
        var fileName = url.split('/').pop().split('\\').pop();
        var baseName = fileName.replace(/\.[^/.]+$/, '').trim();
        if (baseName && lyricsMap[baseName]) return lyricsMap[baseName];
        for (var k2 = 0; k2 < keys.length; k2++) {
            if (keys[k2].toLowerCase() === baseName.toLowerCase()) return lyricsMap[keys[k2]];
        }

        var normalize = function (s) { return s.replace(/\s+/g, '').toLowerCase(); };
        var normTrack = normalize(trackName);
        var normBase = normalize(baseName);
        for (var k3 = 0; k3 < keys.length; k3++) {
            var normKey = normalize(keys[k3]);
            if (normKey === normTrack || normKey === normBase) return lyricsMap[keys[k3]];

    function fmtTime(t) {
        if (isNaN(t) || !isFinite(t)) return '0:00';
        var m = Math.floor(t / 60);
        var s = Math.floor(t % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ---- Progress bar (seek) ----
    function updateProgress() {
        if (!audio.duration || !isFinite(audio.duration)) return;
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        progressHandle.style.left = pct + '%';
        currentTimeEl.textContent = fmtTime(audio.currentTime);
    }

    function updateTotalTime() {
        if (audio.duration && isFinite(audio.duration)) {
            totalTimeEl.textContent = fmtTime(audio.duration);
        }
    }

    // Seek bar interaction
    (function initSeek() {
        var dragging = false;
        function seekFromEvent(e) {
            var rect = seekBar.getBoundingClientRect();
            var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            var pct = Math.max(0, Math.min(1, x / rect.width));
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = pct * audio.duration;
            }
            progressFill.style.width = (pct * 100) + '%';
            progressHandle.style.left = (pct * 100) + '%';
        }
        seekBar.addEventListener('mousedown', function (e) {
            dragging = true;
            seekFromEvent(e);
            e.preventDefault();
        });
        document.addEventListener('mousemove', function (e) {
            if (dragging) { seekFromEvent(e); e.preventDefault(); }
        });
        document.addEventListener('mouseup', function () { dragging = false; });
        seekBar.addEventListener('touchstart', function (e) {
            dragging = true;
            seekFromEvent(e);
            e.preventDefault();
        });
        document.addEventListener('touchmove', function (e) {
            if (dragging) { seekFromEvent(e); e.preventDefault(); }
        });
        document.addEventListener('touchend', function () { dragging = false; });
    })();

    // ---- Volume slider (custom div, no input range — CEF incompatible) ----
    function updateVolUI(vol) {
        var pct = vol * 100;
        volFill.style.width = pct + '%';
        volHandle.style.left = pct + '%';
    }
    updateVolUI(TARGET_VOLUME);

    (function initVolume() {
        var dragging = false;
        function setVolFromEvent(e) {
            var rect = volTrack.getBoundingClientRect();
            var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            var pct = Math.max(0, Math.min(1, x / rect.width));
            TARGET_VOLUME = pct;
            audio.volume = pct;
            updateVolUI(pct);
        }
        volTrack.addEventListener('mousedown', function (e) {
            dragging = true;
            volTrack.classList.add('dragging');
            setVolFromEvent(e);
            e.preventDefault();
            e.stopPropagation();
        });
        document.addEventListener('mousemove', function (e) {
            if (dragging) { setVolFromEvent(e); e.preventDefault(); }
        });
        document.addEventListener('mouseup', function () {
            dragging = false;
            volTrack.classList.remove('dragging');
        });
        volTrack.addEventListener('touchstart', function (e) {
            dragging = true;
            setVolFromEvent(e);
            e.preventDefault();
            e.stopPropagation();
        });
    })();

    // ---- Playlist UI ----
    function updatePlaylistUI() {
        var html = '';
        for (var i = 0; i < playlist.length; i++) {
            var cls = (i === currentTrack) ? 'mc-pl-item active' : 'mc-pl-item';
            html += '<li class="' + cls + '" data-idx="' + i + '">';
            html += '<span class="mc-pl-indicator"></span>';
            html += '<span class="mc-pl-name">' + trackNames[i].replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
            if (i >= BUILTIN_TRACKS.length) {
                html += '<span class="mc-pl-badge">本地</span>';
                html += '<button class="mc-pl-remove" data-idx="' + i + '">&#10005;</button>';
            }
            html += '</li>';
        }
        playlistEl.innerHTML = html;

        // Click to play
        var items = playlistEl.querySelectorAll('.mc-pl-item');
        for (var j = 0; j < items.length; j++) {
            items[j].addEventListener('click', function (e) {
                if (e.target.classList.contains('mc-pl-remove')) return;
                var idx = parseInt(this.getAttribute('data-idx'), 10);
                loadTrack(idx);
                playTrack();
            });
        }

        // Remove button
        var removes = playlistEl.querySelectorAll('.mc-pl-remove');
        for (var k = 0; k < removes.length; k++) {
            removes[k].addEventListener('click', function (e) {
                e.stopPropagation();
                var idx = parseInt(this.getAttribute('data-idx'), 10);
                removeTrack(idx);
            });
        }
        updatePlScrollbar();
    }

    function removeTrack(index) {
        if (index < BUILTIN_TRACKS.length) return; // Cannot remove built-in
        playlist.splice(index, 1);
        trackNames.splice(index, 1);
        if (currentTrack >= playlist.length) currentTrack = playlist.length - 1;
        if (currentTrack < 0) currentTrack = 0;
        loadTrack(currentTrack);
        playTrack();
    }

    // ---- Volume panel toggle ----
    volToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        mcPanel.classList.toggle('vol-expanded');
    });

    // ---- Playlist wheel scroll (native scrollbar too thin / wheel unreliable in CEF) ----
    playlistEl.addEventListener('wheel', function (e) {
        if (playlistEl.scrollHeight <= playlistEl.clientHeight) return;
        var dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 16;            // lines -> px
        else if (e.deltaMode === 2) dy *= playlistEl.clientHeight; // pages -> px
        playlistEl.scrollTop += dy;
        e.preventDefault();
        e.stopPropagation();
    }, { passive: false });

    // ---- Custom playlist scrollbar (native scrollbar drag/wheel unreliable in CEF) ----
    function updatePlScrollbar() {
        var sh = playlistEl.scrollHeight;
        var ch = playlistEl.clientHeight;
        if (sh <= ch + 2 || ch <= 0) {
            plScrollbar.style.opacity = '0';
            plScrollbar.style.pointerEvents = 'none';
            return;
        }
        var margin = 6;
        var trackH = ch - margin * 2;
        var thumbH = Math.max(26, Math.floor(ch * ch / sh));
        var maxTop = trackH - thumbH;
        var ratio = playlistEl.scrollTop / (sh - ch);
        if (isNaN(ratio) || !isFinite(ratio)) ratio = 0;
        plThumb.style.height = thumbH + 'px';
        plThumb.style.top = (margin + ratio * maxTop) + 'px';
        plScrollbar.style.opacity = '1';
        plScrollbar.style.pointerEvents = 'auto';
    }

    playlistEl.addEventListener('scroll', updatePlScrollbar);

    var plDragging = false;
    plThumb.addEventListener('mousedown', function (e) {
        plDragging = true;
        plThumb.classList.add('dragging');
        e.preventDefault();
        e.stopPropagation();
    });
    document.addEventListener('mousemove', function (e) {
        if (!plDragging) return;
        var rect = playlistEl.getBoundingClientRect();
        var ch = playlistEl.clientHeight;
        var sh = playlistEl.scrollHeight;
        var margin = 6;
        var trackH = ch - margin * 2;
        var thumbH = Math.max(26, Math.floor(ch * ch / sh));
        var maxTop = trackH - thumbH;
        var y = (e.clientY - rect.top) - margin - thumbH / 2;
        var ratio = Math.max(0, Math.min(1, y / maxTop));
        playlistEl.scrollTop = ratio * (sh - ch);
        e.preventDefault();
    });
    document.addEventListener('mouseup', function () {
        if (plDragging) {
            plDragging = false;
            plThumb.classList.remove('dragging');
        }
    });
    plScrollbar.addEventListener('mousedown', function (e) {
        if (e.target === plThumb) return;   // thumb handled by its own drag
        if (playlistEl.scrollHeight <= playlistEl.clientHeight) return;
        var rect = playlistEl.getBoundingClientRect();
        var ch = playlistEl.clientHeight;
        var sh = playlistEl.scrollHeight;
        var margin = 6;
        var trackH = ch - margin * 2;
        var thumbH = Math.max(26, Math.floor(ch * ch / sh));
        var maxTop = trackH - thumbH;
        var y = (e.clientY - rect.top) - margin - thumbH / 2;
        var ratio = Math.max(0, Math.min(1, y / maxTop));
        playlistEl.scrollTop = ratio * (sh - ch);
    });

    // ---- Playlist panel toggle ----
    playlistToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        mcPanel.classList.toggle('expanded');
        updatePlaylistUI();
        setTimeout(updatePlScrollbar, 370);
    });

    // ---- Add local music ----
    addBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        fileInput.click();
    });

    // Rebuild file input after each use (CEF bug: click() won't fire a second time)
    function resetFileInput() {
        var old = document.getElementById('mc-file-input');
        if (old) old.parentNode.removeChild(old);
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.id = 'mc-file-input';
        inp.accept = 'audio/*,.lrc';
        inp.multiple = true;
        inp.hidden = true;
        document.getElementById('mc-add-local').appendChild(inp);
        fileInput = inp;
        bindFileInput();
    }

    function bindFileInput() {
        fileInput.addEventListener('change', function () {
            var files = fileInput.files;
            if (!files || files.length === 0) return;
            var oldLength = playlist.length;
            var added = 0;
            for (var i = 0; i < files.length; i++) {
                (function (file) {
                    if (/\.(mp3|wav|ogg|flac|m4a|aac)$/i.test(file.name)) {
                        var url = URL.createObjectURL(file);
                        playlist.push(url);
                        trackNames.push(file.name.replace(/\.[^.]+$/, ''));
                        added++;
                    }
                })(files[i]);
            }
            if (added > 0) {
                updatePlaylistUI();
                // Auto-play first track from THIS batch if nothing was playing
                if (audio.paused && oldLength > 0) {
                    loadTrack(oldLength);
                    playTrack();
                }
            }
            // Rebuild the input so it can be clicked again in CEF
            resetFileInput();
        });
    }

    bindFileInput();

    // ---- Button handlers ----
    playBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) {
            playTrack();
        } else {
            audio.pause();
            updatePlayBtn(false);
        }
    });

    prevBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        playPrev();
    });

    nextBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        playNext();
    });

    shuffleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        shuffleMode = !shuffleMode;
        if (shuffleMode) {
            shuffleBtn.classList.add('active');
            shuffleBtn.title = '随机播放';
        } else {
            shuffleBtn.classList.remove('active');
            shuffleBtn.title = '顺序播放';
        }
    });

    // ---- Audio events ----
    audio.addEventListener('timeupdate', function () {
        updateProgress();
        updateLyrics(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', updateTotalTime);
    audio.addEventListener('durationchange', updateTotalTime);

    audio.addEventListener('play', function () {
        updatePlayBtn(true);
    });

    audio.addEventListener('pause', function () {
        updatePlayBtn(false);
    });

    audio.addEventListener('ended', function () {
        playNext();
    });

    audio.addEventListener('error', function () {
        titleEl.textContent = '(加载失败) ' + trackNames[currentTrack];
        updatePlayBtn(false);
    });

    // ---- INIT: dead simple, no AudioContext tricks ----
    function initAudio() {
        loadTrack(Math.floor(Math.random() * playlist.length));
        updatePlaylistUI();
        playTrack();
    }

    // ---- User interaction fallback (if CEF blocks autoplay) ----
    var interactionDone = false;
    function onFirstClick() {
        if (interactionDone) return;
        if (audio.paused) {
            playTrack();
        }
        interactionDone = true;
    }
    document.addEventListener('click', onFirstClick);
    document.addEventListener('touchstart', onFirstClick);
    // Remove listeners after first successful play
    audio.addEventListener('play', function () {
        if (!interactionDone) interactionDone = true;
        document.removeEventListener('click', onFirstClick);
        document.removeEventListener('touchstart', onFirstClick);
    });

    // Start
    initAudio();
})();
</script>

</body>
</html>
